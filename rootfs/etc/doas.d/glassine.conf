# sudo (doas-sudo-shim) / doas for the desktop user (with its own password)
permit persist :wheel
# every desktop user (group desktop: the account glassine-setup made, or the plain
# layout's preset "user"). Who may run which of their commands: each helper decides
# (usr/lib/glassine/admin-auth.sh).
permit nopass :desktop as root cmd /usr/sbin/glassine-power-root
permit nopass :desktop as root cmd /usr/sbin/glassine-settings-root
