# Keyboard shortcuts of the device sway session (a Bluetooth keyboard
# + mouse paired), included by the sway config. Our own model: glassine-swayd's tiles
# (newest first, at most 4 per workspace), glassine-shell's popups, no on-screen
# popup for volume or light (e-ink: a refresh per key press).
#
# glassine-settings > Keyboard lists them from the "## " lines here:
# ## LABEL above a bindsym: listed with that binding's keys
# ## KEYS = LABEL a group (or keys without a readable name): as written
#
# Your own: ~/.config/glassine/sway.d/* (included after this file). A combo that is
# already bound here takes yours with `bindsym --no-warn ...` (without it sway
# still takes yours, but shows a warning bar). `swaymsg reload` applies.
# Nothing here is a key wvkbd sends for typing (letters, digits, Return alone).

set $mod Mod4

# the hardware keyboards' layout (glassine-kbd-layout: glassine-settings > Keyboard, else
# the on-screen keyboard's language; sway itself set none: US). Written at the
# start and on each reload; wvkbd's virtual keyboard keeps its own keymap
include ~/.config/glassine/sway-keyboard.conf
exec_always /usr/bin/glassine-kbd-layout

## Terminal
bindsym $mod+Return exec foot
## Close the window
bindsym $mod+q kill
## End the session (sway exits)
bindsym $mod+Shift+e exit

# Super pressed and released alone: the app drawer (a chord with Super, e.g.
# Super+Tab, does not open it: sway's release binding needs the key alone)
## Super, Super+Space = App drawer
bindsym --release Super_L exec /usr/bin/glassine-shell-wl toggle launcher
bindsym $mod+space exec /usr/bin/glassine-shell-wl toggle launcher
## Alt+Tab, Super+Tab = Overview of workspaces and windows
bindsym Mod1+Tab exec /usr/bin/glassine-shell-wl toggle workspaces
bindsym $mod+Tab exec /usr/bin/glassine-shell-wl toggle workspaces

## Super+arrows = Focus the window that way
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
# a swap in glassine-swayd's order (sway's own `move` would undo its layout)
## Super+Shift+arrows = Swap with the window that way
bindsym $mod+Shift+Left exec /usr/bin/glassine-swayd swapdir left
bindsym $mod+Shift+Right exec /usr/bin/glassine-swayd swapdir right
bindsym $mod+Shift+Up exec /usr/bin/glassine-swayd swapdir up
bindsym $mod+Shift+Down exec /usr/bin/glassine-swayd swapdir down
## Super+1…9 = Workspace 1–9
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
## Full screen on/off
bindsym $mod+f fullscreen toggle

## Sleep
bindsym $mod+l exec doas /usr/sbin/glassine-power-root sleep
## Power menu
bindsym Control+Mod1+Delete exec /usr/bin/glassine-shell-wl toggle power
## Refresh the whole screen (clears ghosting)
bindsym $mod+r exec /usr/bin/glassine-refresh
## Print = Screenshot to Pictures/Screenshots
bindsym Print exec /usr/bin/glassine-screenshot

# the keyboard's media keys. Volume: WirePlumber saves it (glassine-pipewire brings it
# back after a restart); capped at 100 %
## Volume keys = Louder, quieter, mute
bindsym XF86AudioRaiseVolume exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
## Mic mute key = Microphone on/off
bindsym XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# the player (MPRIS: any app that has one, Bluetooth via mpris-proxy)
## Media keys = Play/pause, next, previous, stop
bindsym XF86AudioPlay exec playerctl play-pause
bindsym XF86AudioPause exec playerctl pause
bindsym XF86AudioNext exec playerctl next
bindsym XF86AudioPrev exec playerctl previous
bindsym XF86AudioStop exec playerctl stop
# the front light, one step as the quick settings' sliders (glassine-shell saves it in
# /etc/glassine/power.conf; a managed light: the offset from its schedule)
## Brightness keys = Front light brighter, darker
bindsym XF86MonBrightnessUp exec /usr/bin/glassine-shell-wl light up
bindsym XF86MonBrightnessDown exec /usr/bin/glassine-shell-wl light down
## Shift+brightness keys = Warmer, cooler
bindsym Shift+XF86MonBrightnessUp exec /usr/bin/glassine-shell-wl light warmer
bindsym Shift+XF86MonBrightnessDown exec /usr/bin/glassine-shell-wl light cooler
