# The grey output (/etc/glassine/sway-grey, ): the output is in panel
# order with transform 270, and wlroots also applies an output's transform to the
# absolute input mapped to it. These are config's matrices with that rotation
# undone (T90 after them): the touchscreen is already in panel order. Linked to
# /run/glassine-sway-input.conf by glassine-session-sway, which config includes.
input type:touch calibration_matrix 1 0 0 0 1 0
input type:tablet_tool calibration_matrix -1 0 1 0 -1 1
