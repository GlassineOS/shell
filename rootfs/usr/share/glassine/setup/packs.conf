# glassine-setup's software packs: one [id] per pack.
# name, icon (Material name), desc, apps (the card's line), mb (download, MB),
# rec (1 = "Suggested"), apk = Alpine packages, flatpak = Flathub app ids,
# status = offered | demo. Only "offered" packs show and install; the rest are
# the design's sample packs, kept for the demo until their contents are verified
# on this base. mb values are estimates until measured (apk info -s / Flathub).
# The offered list is A28/'s (the apps a deployments base leaves out); which
# packs to offer is the user's decision.

[web]
name = Web browser
icon = public
desc = Firefox, with the e-ink settings
apps = Firefox ESR
mb = 260
rec = 1
apk = firefox-esr glassine-firefox
status = offered

[store]
name = App store
icon = storefront
desc = Browse and install Flatpak apps
apps = Bazaar · Flathub
mb = 90
flatpak = io.github.kolunmi.Bazaar
status = offered

[news]
name = News
icon = description
desc = A Reddit reader, tuned for e-ink
apps = Headlines
mb = 40
apk = glassine-headlines
status = offered

[containers]
name = Containers
icon = deployed_code
desc = Run containers with Podman, under your own account
apps = Podman · Compose
mb = 60
apk = glassine-podman podman-compose
status = offered

[dev]
name = Development
icon = code
desc = Editors, debuggers and version control
apps = Git · Vim · Python 3 · GDB
mb = 180
apk = git vim strace gdb binutils python3
status = offered

