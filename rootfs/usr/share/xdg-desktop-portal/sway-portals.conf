# xdg-desktop-portal backends in the sway session (XDG_CURRENT_DESKTOP=sway):
# gtk.portal is only "UseIn=gnome", so without this file sway got no
# file chooser/settings for Flatpak apps. wlr for screenshots/screen casts.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
