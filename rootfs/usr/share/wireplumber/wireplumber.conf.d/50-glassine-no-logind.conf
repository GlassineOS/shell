# GlassineOS has no logind (seatd holds the seat): WirePlumber's optional logind
# support can only fail to load, and Bluetooth's seat monitoring needs it (without
# it, Bluetooth audio runs whoever is on the seat, as on a single-user device).
wireplumber.profiles = {
  main = {
    support.logind = disabled
    monitor.bluez.seat-monitoring = disabled
  }
}
