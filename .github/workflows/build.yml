name: build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: the two programs, on Alpine
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.24 sh -euc '
            apk add -q build-base linux-headers pkgconf wayland-dev wayland-protocols json-c-dev libxkbcommon-dev \
              pango-dev librsvg-dev glib-dev cairo-dev
            make OUT=/tmp all'
  check:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: the host tests
        run: make check
